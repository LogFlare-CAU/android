appId: com.logflare.android
---
# My -> Add member -> back; My -> member -> Edit member.
- runFlow: _login.yaml
- tapOn:
    id: "nav_my_page"
- assertVisible:
    id: "my_page"
- assertVisible: "qa-admin"
- takeScreenshot:
    path: ${QA_OUTPUT_DIR}/my_page_${QA_THEME}
    cropOn:
      id: "app_root"
- scrollUntilVisible:
    element:
      id: "add_member"
- tapOn:
    id: "add_member"
- assertVisible: "Member name"
- takeScreenshot:
    path: ${QA_OUTPUT_DIR}/add_member_${QA_THEME}
    cropOn:
      id: "app_root"
- back
- assertVisible:
    id: "my_page"
- scrollUntilVisible:
    element:
      id: "member_row_minsu"
- tapOn:
    id: "member_row_minsu"
- assertVisible:
    id: "edit_member"
- assertVisible: "minsu"
- takeScreenshot:
    path: ${QA_OUTPUT_DIR}/edit_member_${QA_THEME}
    cropOn:
      id: "app_root"
