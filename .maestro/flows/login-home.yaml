appId: com.logflare.android
---
# Sign in -> Home: summary strip, recent errors and projects from the fixture.
- runFlow: _login.yaml
- assertVisible: "Errors · 24h"
- assertVisible: "NullPointerException in PaymentService"
- takeScreenshot:
    path: ${QA_OUTPUT_DIR}/home_${QA_THEME}
    cropOn:
      id: "app_root"
