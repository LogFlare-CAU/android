appId: com.logflare.android
---
# Sign in -> Home. Data-independent: the dev runner plays this against a real server by default,
# so it asserts only chrome every Home has (the summary strip), never fixture values.
- runFlow: _login.yaml
- assertVisible: "Errors · 24h"
- takeScreenshot:
    path: ${QA_OUTPUT_DIR}/home_${QA_THEME}
    cropOn:
      id: "app_root"
