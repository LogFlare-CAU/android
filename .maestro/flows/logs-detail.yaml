appId: com.logflare.android
---
# Logs -> Level sheet "Error and above" -> first row -> Log detail.
- runFlow: _login.yaml
- tapOn:
    id: "nav_logs"
- assertVisible:
    id: "logs_list"
- tapOn:
    id: "filter_log_level"
- tapOn: "Error and above"
- assertNotVisible: "Slow query: .*"
- assertVisible: "NullPointerException in PaymentService"
- takeScreenshot:
    path: ${QA_OUTPUT_DIR}/logs_${QA_THEME}
    cropOn:
      id: "app_root"
- tapOn: "NullPointerException in PaymentService"
- assertVisible:
    id: "log_detail"
- assertVisible: "Raw data"
- takeScreenshot:
    path: ${QA_OUTPUT_DIR}/log_detail_${QA_THEME}
    cropOn:
      id: "app_root"
